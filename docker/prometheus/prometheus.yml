global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:9187']  # exporter PostgreSQL à ajouter si besoin

  - job_name: 'dbt'
    static_configs:
      - targets: ['host.docker.internal:8000']  # si vous exposez un endpoint dbt