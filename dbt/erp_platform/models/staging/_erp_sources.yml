version: 2

sources:
  - name: raw
    description: Données brutes chargées par le pipeline d'ingestion Python
    schema: raw
    tables:
      - name: erp_ventes_achats
        description: Écritures de vente 2023-2024
        columns:
          - name: date_ecriture
            data_tests:
              - not_null
          - name: type_ecriture
            data_tests:
              - not_null
              - accepted_values:
                  values: ["Vente", "Résultat d''assemblage"]
          - name: type_document
            data_tests:
              - not_null
          - name: quantite
            data_tests:
              - not_null
          - name: numero_article
            data_tests:
              - not_null
          - name: code_magasin
            data_tests:
              - not_null
          - name: code_unite
            data_tests:
              - not_null
          - name: quantite_facturee
            data_tests:
              - not_null
          - name: montant_reel
            data_tests:
              - not_null

      - name: erp_production_assemblage
        description: Écritures de production et assemblage 2023
        columns:
          - name: numero_origine
            data_tests:
              - not_null
          - name: date_ecriture
            data_tests:
              - not_null
          - name: type_ecriture
            data_tests:
              - not_null
              - accepted_values:
                  values: ["Consommation d''assemblage", "Résultat d''assemblage"]
          - name: numero_commande
            data_tests:
              - not_null
          - name: type_document
            data_tests:
              - not_null
          - name: numero_document
            data_tests:
              - not_null
          - name: quantite
            data_tests:
              - not_null
          - name: numero_article
            data_tests:
              - not_null
          - name: code_magasin
            data_tests:
              - not_null
          - name: code_unite
            data_tests:
              - not_null

      - name: erp_referentiel_articles
        description: Référentiel articles (master data)
        columns:
          - name: numero_article
            data_tests:
              - not_null
              - unique
          - name: description
            data_tests:
              - not_null
          - name: unite_base
            data_tests:
              - not_null
          - name: stock
            data_tests:
              - not_null