version: 2

models:
  - name: dim_date
    description: Calendrier jour par jour couvrant la plage des écritures présentes
    columns:
      - name: date_id
        data_tests:
          - unique
          - not_null

  - name: dim_article
    description: Un article par ligne, avec statistiques dérivées des transactions
    columns:
      - name: article_key
        data_tests:
          - unique
          - not_null
      - name: numero_article
        data_tests:
          - unique
          - not_null

  - name: dim_unite
    description: Unités de mesure observées, catégorisées
    columns:
      - name: unite_key
        data_tests:
          - unique
          - not_null

  - name: fact_transactions
    description: >
      Table de faits au grain "ligne d'écriture Ventes". Signe normalisé
      en amont : quantite_stock négative = sortie.
    columns:
      - name: transaction_id
        data_tests:
          - unique
          - not_null
      - name: date_id
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_id
      - name: article_key
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_article')
              field: article_key
      - name: unite_key
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_unite')
              field: unite_key

  - name: mart_abc_article
    description: Classement Pareto (A/B/C) des articles par contribution au CA net
    columns:
      - name: article_key
        data_tests:
          - unique
          - not_null
      - name: classe_abc
        data_tests:
          - accepted_values:
              values: ["A", "B", "C"]