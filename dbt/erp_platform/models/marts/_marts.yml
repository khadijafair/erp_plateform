version: 2

models:
  - name: dim_date
    description: Calendrier jour par jour couvrant la plage des écritures présentes
    columns:
      - name: date_id
        data_tests:
          - unique
          - not_null

  - name: dim_article
    description: Un article par ligne, avec statistiques dérivées des transactions (pas de référentiel article externe disponible)
    columns:
      - name: article_key
        data_tests:
          - unique
          - not_null
      - name: numero_article
        data_tests:
          - unique
          - not_null

  - name: dim_unite
    description: Unités de mesure observées, catégorisées (poids / unitaire / conditionnement) — non convertibles entre elles sans référentiel externe
    columns:
      - name: unite_key
        data_tests:
          - unique
          - not_null

  - name: fact_transactions
    description: >
      Table de faits au grain "ligne d'écriture Ventes/Achats". Signe déjà
      normalisé en amont (staging) : quantite_stock négative = sortie,
      positive = entrée ; montant_reel positif pour un achat, au signe
      d'origine pour une vente/retour.
    columns:
      - name: transaction_id
        data_tests:
          - unique
          - not_null
      - name: date_id
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_id
      - name: article_key
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_article')
              field: article_key
      - name: unite_key
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_unite')
              field: unite_key

  - name: mart_marge_article
    description: >
      Marge brute estimée par article (CA net - coût des quantités vendues
      valorisées au CMUP achat). Voir colonne marge_fiable : false si
      l'article mélange plusieurs unités (CMUP alors non comparable), auquel
      cas le chiffre est indicatif seulement, pas à publier tel quel.
    columns:
      - name: article_key
        data_tests:
          - unique
          - not_null
          - relationships:
              to: ref('dim_article')
              field: article_key

  - name: mart_abc_article
    description: Classement Pareto (A/B/C) des articles par contribution au chiffre d'affaires net
    columns:
      - name: article_key
        data_tests:
          - unique
          - not_null
      - name: classe_abc
        data_tests:
          - accepted_values:
              values: ["A", "B", "C"]

  - name: mart_anomalies_ventes
    description: >
      Lignes de vente dont le prix unitaire facturé est inférieur au CMUP
      achat de l'article (détection par règle métier, restreinte aux
      articles à unité unique pour éviter les faux positifs).
    columns:
      - name: transaction_id
        data_tests:
          - unique
          - not_null
