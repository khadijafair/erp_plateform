version: 2

models:
  - name: dim_date
    description: Dimension calendrier au grain quotidien.
    columns:
      - name: date_id
        data_tests:
          - unique
          - not_null

  - name: dim_article
    description: Dimension article dérivée des écritures de transactions.
    columns:
      - name: article_key
        data_tests:
          - unique
          - not_null
      - name: numero_article
        data_tests:
          - unique
          - not_null

  - name: dim_unite
    description: Dimension des unités de mesure observées.
    columns:
      - name: unite_key
        data_tests:
          - unique
          - not_null

  - name: fact_transactions
    description: Table de faits consolidée des écritures Ventes et Achats.
    columns:
      - name: transaction_id
        data_tests:
          - unique
          - not_null
      - name: date_id
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_id
      - name: article_key
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_article')
              field: article_key
      - name: unite_key
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_unite')
              field: unite_key

  - name: mart_marge_article
    description: Marge brute estimée par article (CA net moins CMUP).
    columns:
      - name: article_key
        data_tests:
          - unique
          - not_null
          - relationships:
              to: ref('dim_article')
              field: article_key

  - name: mart_abc_article
    description: Classification Pareto (A/B/C) selon la contribution au CA net.
    columns:
      - name: article_key
        data_tests:
          - unique
          - not_null
      - name: classe_abc
        data_tests:
          - accepted_values:
              values: ["A", "B", "C"]

  - name: mart_anomalies_ventes
    description: Détection des ventes à perte (prix unitaire de vente inférieur au CMUP).
    columns:
      - name: transaction_id
        data_tests:
          - unique
          - not_null