name: 'erp_platform'
version: '1.0.0'
config-version: 2

profile: 'erp_platform'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Variables globales du projet
vars:
  retour_vente_document_types:
    - "Réception retour vente"
  vente_document_types:
    - "Expédition vente"
  achat_document_types:
    - "Réception achat"

# Configuration des couches de modélisation
models:
  erp_platform:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: ephemeral
    marts:
      +materialized: table
      +schema: marts