# =========================================================================
# Fichier de configuration de source — piloté par l'utilisateur, pas par le code
# -------------------------------------------------------------------------
# Ce fichier décrit UNE source de données (ici : extrait ERP Ventes/Achats).
# Le code Python (ingestion/) ne connaît AUCUN nom de colonne en dur :
# tout passe par ce mapping. Pour brancher un nouvel extrait ERP demain,
# même avec des colonnes renommées ou réordonnées, il suffit de dupliquer
# ce fichier et d'ajuster le "mapping" — aucune ligne de code à toucher.
# =========================================================================

source_id: erp_ventes_achats
label: "Écritures comptables Ventes/Achats (ERP)"
connector: excel            # doit correspondre à un connecteur dans ingestion/connectors/
file_pattern: "*.xlsx"      # utilisé par main.py pour retrouver le fichier dans data/raw/

# ---- Mapping : nom métier générique -> nom réel de colonne dans le fichier source ----
# Le nom à gauche (clé) est stable et utilisé partout dans le reste du pipeline (dbt inclus).
# Le nom à droite (valeur) est celui qui apparaît réellement dans CE fichier Excel.
mapping:
  date_ecriture: "Date comptabilisation"
  type_ecriture: "Type écriture"
  type_document: "Type document"
  numero_document: "N° document"
  quantite: "Quantité"
  numero_article: "N° article"
  code_unite: "Code unité"
  quantite_facturee: "Quantité facturée"
  montant_reel: "Montant  (réel)"

# ---- Schéma attendu : types + règles de validation génériques ----
# Utilisé par ingestion/core/validator.py pour rejeter/alerter sur les
# lignes non conformes AVANT chargement, quel que soit le domaine métier.
schema:
  date_ecriture:
    type: date
    required: true
  type_ecriture:
    type: string
    required: true
    allowed_values: ["Vente", "Achat"]
  type_document:
    type: string
    required: true
  numero_document:
    type: string
    required: true
  quantite:
    type: float
    required: true
  numero_article:
    type: string
    required: true
  code_unite:
    type: string
    required: true
  quantite_facturee:
    type: float
    required: true
  montant_reel:
    type: float
    required: true

# ---- Clé "métier" utilisée pour dédoublonner / historiser ----
business_key: ["numero_document", "numero_article"]

# ---- Règles métier spécifiques à CE domaine (Ventes/Achats) ----
# Ces règles ne sont PAS génériques : elles sont propres au module métier
# "ventes_achats" et lues par ce module précis, pas par le moteur générique.
business_rules:
  retour_vente_document_types: ["Réception retour vente"]
  normaliser_signe_quantite: true   # les quantités doivent devenir positives après nettoyage
  cible_table_brute: "raw.erp_ventes_achats"
