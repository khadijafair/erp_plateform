# Configuration de source : Ventes 2023-2024
source_id: erp_ventes_achats
label: "Écritures de vente 2023-2024"
connector: excel
file_pattern: "ventes_achats*.xlsx"

mapping:
  date_ecriture: "Date comptabilisation"
  type_ecriture: "Type écriture"
  type_document: "Type document"
  quantite: "Quantité"
  numero_article: "N° article"
  code_magasin: "Code magasin"
  code_unite: "Code unité"
  quantite_facturee: "Quantité facturée"
  montant_reel: "Montant vente (réel)"

schema:
  date_ecriture:
    type: date
    required: true
  type_ecriture:
    type: string
    required: true
    allowed_values:
      - "Vente"
      - "Résultat d'assemblage"
  type_document:
    type: string
    required: true
  quantite:
    type: float
    required: true
  numero_article:
    type: string
    required: true
  code_magasin:
    type: string
    required: true
  code_unite:
    type: string
    required: true
  quantite_facturee:
    type: float
    required: true
  montant_reel:
    type: float
    required: true



business_rules:
  cible_table_brute: "raw.erp_ventes_achats"
  mode_chargement: replace