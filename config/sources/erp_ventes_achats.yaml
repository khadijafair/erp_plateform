# Configuration de source : ERP Ventes/Achats
source_id: erp_ventes_achats
label: "Écritures comptables Ventes/Achats (ERP)"
connector: excel
file_pattern: "*.xlsx"

# Mapping : nom_standard -> nom_colonne_source
mapping:
  date_ecriture: "Date comptabilisation"
  type_ecriture: "Type écriture"
  type_document: "Type document"
  numero_document: "N° document"
  quantite: "Quantité"
  numero_article: "N° article"
  code_unite: "Code unité"
  quantite_facturee: "Quantité facturée"
  montant_reel: "Montant  (réel)"

# Validation de schéma (contrôle d'ingestion)
schema:
  date_ecriture:
    type: date
    required: true
  type_ecriture:
    type: string
    required: true
    allowed_values:
      - "Vente"
      - "Achat"
  type_document:
    type: string
    required: true
  numero_document:
    type: string
    required: true
  quantite:
    type: float
    required: true
  numero_article:
    type: string
    required: true
  code_unite:
    type: string
    required: true
  quantite_facturee:
    type: float
    required: true
  montant_reel:
    type: float
    required: true

# Clé d'unicité métier
business_key:
  - numero_document
  - numero_article

# Paramètres du domaine Ventes/Achats
business_rules:
  retour_vente_document_types:
    - "Réception retour vente"
  normaliser_signe_quantite: true
  cible_table_brute: "raw.erp_ventes_achats"