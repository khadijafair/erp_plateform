services:
  postgres:
    image: postgres:16
    container_name: erp_platform_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-erp_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-erp_platform}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erp_admin}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # A activer plus tard, une fois l'ingestion + dbt stabilisés :
  # n8n:
  #   image: n8nio/n8n
  #   ports: ["5678:5678"]
  #   depends_on: [postgres]

volumes:
  pgdata:
