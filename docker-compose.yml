services:
  # ========== BASE DE DONNÉES ==========
  postgres:
    image: postgres:16
    container_name: erp_platform_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-erp_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-erp_platform}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erp_admin}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ========== ADMINER (interface web pour PostgreSQL) ==========
  adminer:
    image: adminer:latest
    container_name: erp_platform_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # ========== N8N (orchestration) ==========
  n8n:
    image: n8nio/n8n:latest
    container_name: erp_platform_n8n
    restart: unless-stopped
    ports:
      - "5677:5678"
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-your_encryption_key}
      N8N_DATABASE_TYPE: postgresdb
      N8N_DATABASE_POSTGRESDB_HOST: postgres
      N8N_DATABASE_POSTGRESDB_PORT: 5432
      N8N_DATABASE_POSTGRESDB_DATABASE: ${POSTGRES_DB:-erp_platform}
      N8N_DATABASE_POSTGRESDB_USER: ${POSTGRES_USER:-erp_admin}
      N8N_DATABASE_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      N8N_DATABASE_POSTGRESDB_SCHEMA: n8n
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - n8n_data:/home/node/.n8n
      - ./data/raw:/data/raw

  # ========== OLLAMA (LLM local pour le schema mapper) ==========
  ollama:
    image: ollama/ollama:latest
    container_name: erp_platform_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    # Pour utiliser le GPU (NVIDIA) sur Windows/WSL2, décommentez ces lignes :
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    command: serve

  # ========== POSTGRES EXPORTER (métriques pour Prometheus) ==========
  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: erp_platform_postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-erp_admin}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-erp_platform}?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy

  # ========== PROMETHEUS (monitoring) ==========
  prometheus:
    image: prom/prometheus:latest
    container_name: erp_platform_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  # ========== GRAFANA (visualisation monitoring) ==========
  grafana:
    image: grafana/grafana:latest
    container_name: erp_platform_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus

  # ========== DBT (exécution dans un conteneur) ==========
  dbt:
    image: ghcr.io/dbt-labs/dbt-postgres:1.8.0
    container_name: erp_platform_dbt
    restart: unless-stopped
    working_dir: /usr/app/dbt
    volumes:
      - ./dbt/erp_platform:/usr/app/dbt          # Code dbt
      - ./dbt/profiles.yml:/root/.dbt/profiles.yml  # Profil dbt (à créer)
      - dbt_packages:/usr/app/dbt/dbt_packages   # Persistence des packages
    depends_on:
      postgres:
        condition: service_healthy
    # On garde le conteneur actif pour pouvoir y exécuter des commandes
    command: ["tail", "-f", "/dev/null"]

volumes:
  pgdata:
  n8n_data:
  ollama_data:
  prometheus_data:
  grafana_data:
  dbt_packages: